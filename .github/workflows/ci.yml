name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit + integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "Install fuse-overlayfs (Linux: FUSE-backed integration tests)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - name: "Install WinFsp (Windows: FUSE-backed integration tests)"
        if: runner.os == 'Windows'
        run: choco install winfsp -y
      # fuser's build.rs probes pkg-config 'fuse' on macOS; without FUSE-T
      # the crate does not compile at all, so install it before building.
      - name: Install FUSE-T (macOS build dependency)
        if: runner.os == 'macOS'
        run: bash scripts/macos/install-fuse-t.sh
      - run: cargo test --workspace -- --nocapture

  e2e:
    name: "E2E (${{ matrix.os }}${{ matrix.sudo && ' as root' || '' }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root => kernel overlayfs backend (native performance).
          - os: ubuntu-latest
            sudo: true
          # FUSE-T is a kext-less, *unprivileged* NFS-based FUSE: no sudo
          # needed (and root runs it worse, see probe failures as root).
          - os: macos-latest
            sudo: false
          # Admin runner => WinFsp kernel driver via choco.
          - os: windows-latest
            sudo: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fuse-overlayfs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - name: Install WinFsp (Windows)
        if: runner.os == 'Windows'
        run: choco install winfsp -y
      - name: Install FUSE-T (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/macos/install-fuse-t.sh
      - name: Run E2E acceptance suite
        shell: bash
        run: |
          if [ "${{ matrix.sudo }}" = "true" ]; then
            # sudo -E keeps RUSTUP_HOME/CARGO_HOME, but sudoers rewrites PATH:
            # pass it through explicitly or `cargo` is not found.
            # --test-threads=1: the suite mounts real filesystems; parallel
            # tests on shared backends (WinFsp) are timing-fragile.
            sudo -E env "PATH=$PATH" bash -c \
              'cargo test --test e2e -- --ignored --nocapture --test-threads=1'
          else
            cargo test --test e2e -- --ignored --nocapture --test-threads=1
          fi

  cross-platform-check:
    name: cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          # x86_64-apple-darwin was removed: fuser cannot build for macOS on
          # a Linux host (its build.rs probes pkg-config 'fuse' on the host);
          # the macOS target is compiled natively by the macos test job.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # winfsp-sys is vendored with pre-generated bindings (no bindgen),
      # so this job needs no libclang / mingw headers anymore.
      - name: Cross-compile check
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  release-binary:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, test, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # fuser's build.rs probes pkg-config 'fuse' on macOS; without FUSE-T
      # the crate does not compile at all.
      - name: Install FUSE-T (macOS build dependency)
        if: runner.os == 'macOS'
        run: bash scripts/macos/install-fuse-t.sh
      - run: cargo build --release
      - name: Smoke test the binary
        # The macOS binary links FUSE-T's libfuse-t.dylib (rpath not embedded
        # in release builds); point dyld at the install location.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export DYLD_LIBRARY_PATH=/usr/local/lib; fi
          ./target/release/cowt --version
          ./target/release/cowt doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: cowt-${{ matrix.os }}
          path: target/release/cowt${{ runner.os == 'Windows' && '.exe' || '' }}
