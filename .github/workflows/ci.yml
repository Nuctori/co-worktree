name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit + integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "Install fuse-overlayfs (Linux: FUSE-backed integration tests)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - name: "Install WinFsp (Windows: FUSE-backed integration tests)"
        if: runner.os == 'Windows'
        run: choco install winfsp -y
      - run: cargo test --workspace -- --nocapture

  e2e:
    name: "E2E (${{ matrix.os }}${{ matrix.sudo && ' as root' || '' }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root => kernel overlayfs backend (native performance).
          - os: ubuntu-latest
            sudo: true
          # Root => macOS kernel union mount (`mount -t union`; no kexts,
          # which is what makes macFUSE unusable on CI runners). macos-latest
          # (Sequoia) removed the union.fs helper (mount_union exec fails
          # ENOENT); macos-14 is the newest image where it still exists.
          - os: macos-14
            sudo: true
          # Admin runner => WinFsp kernel driver via choco.
          - os: windows-latest
            sudo: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fuse-overlayfs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - name: Install WinFsp (Windows)
        if: runner.os == 'Windows'
        run: choco install winfsp -y
      - name: Install union mount helper (macOS)
        if: runner.os == 'macOS'
        run: sudo bash scripts/macos/install-union-helper.sh
      - name: Run E2E acceptance suite
        shell: bash
        run: |
          if [ "${{ matrix.sudo }}" = "true" ]; then
            # sudo -E keeps RUSTUP_HOME/CARGO_HOME, but sudoers rewrites PATH:
            # pass it through explicitly or `cargo` is not found.
            sudo -E env "PATH=$PATH" bash -c \
              'cargo test --test e2e -- --ignored --nocapture'
          else
            cargo test --test e2e -- --ignored --nocapture
          fi

  cross-platform-check:
    name: cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # winfsp-sys regenerates its bindings with bindgen at build time; for
      # the windows target, clang needs the mingw-w64 Windows SDK headers.
      # clang 17 is pinned: llvm-18's mmintrin.h conflicts with mingw headers
      # (incompatible vector types) while cross-parsing windows.h.
      - name: Install libclang-17 + mingw headers (bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-17-dev gcc-mingw-w64-x86-64
      - name: Cross-compile check
        env:
          LIBCLANG_PATH: /usr/lib/llvm-17/lib
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_msvc: >-
            -I/usr/x86_64-w64-mingw32/include
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  release-binary:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, test, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Smoke test the binary
        run: |
          ./target/release/cowt --version
          ./target/release/cowt doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: cowt-${{ matrix.os }}
          path: target/release/cowt${{ runner.os == 'Windows' && '.exe' || '' }}
