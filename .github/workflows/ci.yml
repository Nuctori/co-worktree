name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fuse-overlayfs (enables FUSE-backed integration tests)
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - run: cargo test --workspace -- --nocapture

  e2e:
    name: E2E acceptance (real FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fuse-overlayfs
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - name: Build release binary
        run: cargo build --release
      - name: Run E2E acceptance suite
        run: bash scripts/e2e.sh ./target/release/cowt
      - name: Probe FUSE tuning knobs (diagnostic)
        if: always()
        run: |
          set -x
          fuse-overlayfs --version
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>&1 || true
          mkdir -p /tmp/kp/l /tmp/kp/u /tmp/kp/w /tmp/kp/m
          unshare --mount --map-root-user --fork --kill-child --propagation private sh -c 'mount -t overlay overlay -o "lowerdir=$1,upperdir=$2,workdir=$3" "$4"' cowt-probe /tmp/kp/l /tmp/kp/u /tmp/kp/w /tmp/kp/m; echo "kernel-overlay probe rc=$?"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true

  cross-platform-check:
    name: cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target ${{ matrix.target }}

  release-binary:
    name: release build + artifact
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Smoke test the binary
        run: ./target/release/cowt --version && ./target/release/cowt doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: cowt-linux-x86_64
          path: target/release/cowt
