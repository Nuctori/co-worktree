[workspace]
resolver = "2"
members = ["crates/cowt-core", "crates/cowt"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/co-worktree/co-worktree"
# 1.87: the Windows backend depends on winfsp (edition 2024, MSRV 1.87).
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
# `pure`: portable Rust implementation, keeps cross-compiling to Windows/macOS
# trivial (no C/assembly toolchains needed in CI).
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
walkdir = "2"
serde_yml = "0.0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
