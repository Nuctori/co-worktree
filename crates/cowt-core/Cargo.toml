[package]
name = "cowt-core"
description = "Core engine for co-worktree: manifest, diff and three-way merge. Platform independent."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
walkdir.workspace = true
serde_yml.workspace = true

# NFC normalization of manifest keys on macOS (APFS stores filenames in
# whatever form they were written; a deletion spelled differently would
# never match the whiteout byte-exactly — round-29).
[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
proptest = "1"
